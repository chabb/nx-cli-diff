name: Check and update

on:
  workflow_dispatch:  # Add this to enable manual runs
  push:
    branches:
      - main
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7

      - name: Set Git user
        run: |
          git config --global user.email "chabbey78@gmail.com"
          git config --global user.name "chabb"
      - name: Approve packages
        run: |
            npm approve-scripts nx
            npm approve-scripts parcel
            npm approve-scripts esbuild

      - name: Run newVersion.sh
        run: ./newVersion.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Collect error.log files
        if: always()
        run: |
          echo "Searching for error.log under /private/var/folders/df..."
          set -euo pipefail
          found=false
          mkdir -p logs
          # Find matching files and copy them into logs/ with a unique name
          while IFS= read -r -d '' file; do
            echo "Found: $file"
            # make a filesystem-safe unique name by replacing slashes
            base_name=$(echo "$file" | sed 's|/|__|g' | sed 's|^__||')
            cp "$file" "logs/${base_name}"
            found=true
          done < <(find /private/var/folders/df -type f -name 'error.log' -print0 2>/dev/null || true)
          if [ "$found" = "false" ]; then
            echo "No error.log found under /private/var/folders/df"
          fi

      - name: Upload error logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: logs
